openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Stores each user's private todo items — add one, list them, mark one done.
servers:
  - url: /

paths:
  /me/todos:
    get:
      operationId: listMyTodos
      summary: The caller's todo items, oldest first
      security:
        - oauth2: [todos:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's todo items
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Todo' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyTodo
      summary: Add a new todo item for the caller
      security:
        - oauth2: [todos:create]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: The created todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400':
          description: Missing or empty text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/todos/{todoId}/complete:
    post:
      operationId: completeMyTodo
      summary: Mark one of the caller's todo items done
      security:
        - oauth2: [todos:complete]
      parameters:
        - name: todoId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The updated todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '404':
          description: No such todo item for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            todos:read: The caller's own todo items
            todos:create: Add a new todo item
            todos:complete: Mark one of the caller's todo items done
  schemas:
    Todo:
      type: object
      required: [id, text, done, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        done: { type: boolean }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }

security:
  - oauth2: []
